<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor & Radar de Afiliados ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- CABEÇALHO & TOGGLE AUTO DISPARO -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-emerald-400 flex items-center gap-2">
                    ⚡ Gestor de Afiliados - Mercado Livre
                </h1>
                <p class="text-slate-400 text-sm mt-1">Garimpe a raiz do e-commerce e envie pro WhatsApp automaticamente.</p>
            </div>

            <!-- CHAVE ON/OFF AUTO DISPARO WHATSAPP -->
            <button id="btnAuto" onclick="toggleAuto()" class="px-6 py-3 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-slate-700 text-slate-300">
                📲 Auto-Disparo WhatsApp: <span id="txtAuto">OFF</span>
            </button>
        </div>

        <!-- PAINEL DE CONFIGURAÇÕES -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">⚙️ Suas Credenciais de Afiliado</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Seu Tag/ID de Afiliado ML:</label>
                    <input type="text" id="cfgIdAfiliado" placeholder="Ex: MLB_AFILIADO_THIAGO_123" class="w-full bg-slate-900 border border-slate-600 px-4 py-2 rounded-xl text-white">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">URL Webhook do WhatsApp (Opcional):</label>
                    <input type="text" id="cfgWebhook" placeholder="Ex: https://sua-api-whatsapp.com/send" class="w-full bg-slate-900 border border-slate-600 px-4 py-2 rounded-xl text-white">
                </div>
            </div>
            <button onclick="salvarConfig()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded-xl text-sm transition">
                Salvar Configurações
            </button>
        </div>

        <!-- RADAR DE GARIMPO NA RAIZ -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white">🔍 Garimpo na Fonte</h2>
                    <p class="text-slate-400 text-sm">Pesquise categorias ou deixe o bot buscar promoções.</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="text" id="inputTermo" value="promocao" placeholder="Termo de busca..." class="bg-slate-900 border border-slate-600 px-3 py-2 rounded-xl text-sm">
                    <button onclick="carregarOfertas()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-xl text-sm transition">
                        Garimpar Agora
                    </button>
                </div>
            </div>

            <!-- FEED DAS OFERTAS -->
            <div id="gridOfertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-4">
                <p class="text-slate-500 text-sm col-span-full text-center py-8">Carregando painel...</p>
            </div>
        </div>

    </div>

    <script>
        async function carregarConfig() {
            const res = await fetch('/api/config');
            const data = await res.json();
            document.getElementById('cfgIdAfiliado').value = data.id_afiliado || '';
            document.getElementById('cfgWebhook').value = data.webhook_whatsapp || '';
            atualizarBotaoAuto(data.auto_disparo);
        }

        async function salvarConfig() {
            const id_afiliado = document.getElementById('cfgIdAfiliado').value;
            const webhook_whatsapp = document.getElementById('cfgWebhook').value;
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id_afiliado, webhook_whatsapp})
            });
            const data = await res.json();
            alert(data.msg);
        }

        async function toggleAuto() {
            const res = await fetch('/api/toggle-auto', { method: 'POST' });
            const data = await res.json();
            atualizarBotaoAuto(data.auto_disparo);
        }

        function atualizarBotaoAuto(status) {
            const btn = document.getElementById('btnAuto');
            const txt = document.getElementById('txtAuto');
            if(status === 'ON') {
                btn.className = "px-6 py-3 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-emerald-600 text-white shadow-lg shadow-emerald-900/40";
                txt.innerText = "LIGADO (Auto-Disparo Ativo)";
            } else {
                btn.className = "px-6 py-3 rounded-xl font-bold text-sm transition flex items-center gap-2 bg-slate-700 text-slate-300";
                txt.innerText = "DESLIGADO (Modo Manual)";
            }
        }

        async function carregarOfertas() {
            const termo = document.getElementById('inputTermo').value;
            const grid = document.getElementById('gridOfertas');
            grid.innerHTML = `<p class="text-emerald-400 text-sm col-span-full text-center py-8">🔎 Garimpando a API do Mercado Livre em tempo real...</p>`;

            const res = await fetch('/api/garimpar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({termo})
            });
            const data = await res.json();

            grid.innerHTML = '';
            if(!data.ofertas || data.ofertas.length === 0) {
                grid.innerHTML = `<p class="text-slate-500 text-sm col-span-full text-center py-8">Nenhuma oferta encontrada no momento.</p>`;
                return;
            }

            data.ofertas.forEach(item => {
                const isEnviado = item.status === 'enviado';
                const badge = isEnviado 
                    ? `<span class="bg-blue-500/20 text-blue-400 text-xs px-2 py-0.5 rounded font-bold border border-blue-500/30">Enviado</span>`
                    : `<span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded font-bold border border-amber-500/30">Pendente</span>`;

                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex flex-col justify-between gap-3 shadow-lg">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2 py-0.5 rounded border border-emerald-500/30">-${item.desconto}% OFF</span>
                                ${badge}
                            </div>
                            <div class="flex gap-3">
                                <img src="${item.foto}" class="w-16 h-16 object-cover rounded bg-white p-1">
                                <div>
                                    <h3 class="font-bold text-xs text-white line-clamp-2">${item.titulo}</h3>
                                    <div class="mt-1">
                                        <span class="text-xs text-slate-500 line-through">R$ ${item.preco_de}</span>
                                        <span class="text-sm font-extrabold text-emerald-400 ml-1">R$ ${item.preco_por}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2 pt-2 border-t border-slate-800">
                            <button onclick="copiarWhatsApp('${item.titulo}', '${item.preco_por}', '${item.link_afiliado}')" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold py-1.5 rounded-lg text-xs border border-slate-700">
                                📋 Copiar para WhatsApp
                            </button>
                            <button onclick="dispararManual('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 rounded-lg text-xs transition">
                                📲 Disparar via API
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function copiarWhatsApp(titulo, preco, link) {
            const texto = `🔥 *OFERTA NO MERCADO LIVRE!*\n\n📦 ${titulo}\n💰 *Por apenas: R$ ${preco}*\n\n🛒 *Compre pelo link oficial:* ${link}`;
            navigator.clipboard.writeText(texto);
            alert("Texto da oferta copiado com sucesso!");
        }

        async function dispararManual(id) {
            const res = await fetch('/api/disparar-manual', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id})
            });
            const data = await res.json();
            alert(data.msg);
            carregarOfertas();
        }

        carregarConfig();
        carregarOfertas();
    </script>
</body>
</html>
